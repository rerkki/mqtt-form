<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kulutuslukeman lähetys</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>Syötä kulutustiedot</h2>
    <form id="consumptionForm">
        <div class="form-group">
            <label for="reading">1) Kulutuslukema:</label>
            <input type="number" id="reading" step="any" required placeholder="Esim. 124.5">
        </div>
        <div class="form-group">
            <label for="meta1">2) Metadata 1:</label>
            <input type="text" id="meta1" required placeholder="Esim. Laitetunnus tai sijainti">
        </div>
        <div class="form-group">
            <label for="meta2">3) Metadata 2:</label>
            <input type="text" id="meta2" required placeholder="Esim. Mittausyksikkö tai kommentti">
        </div>
        <button type="submit">Lähetä MQTT-viesti</button>
    </form>
    <div id="status"></div>
</div>

<script>
    document.getElementById('consumptionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'none';

        // Kerätään tiedot lomakkeelta
        const payload = {
            reading: parseFloat(document.getElementById('reading').value),
            metadata1: document.getElementById('meta1').value,
            metadata2: document.getElementById('meta2').value,
            timestamp: new Date().toISOString() // Lisätään automaattinen aikaleima mukaan
        };

        try {
            // Lähetetään data Node.js-taustapalvelulle
            const response = await fetch('/send-mqtt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                statusDiv.className = 'status success';
                statusDiv.innerText = '✓ ' + result.message;
                document.getElementById('consumptionForm').reset();
            } else {
                statusDiv.className = 'status error';
                statusDiv.innerText = '❌ Virhe: ' + result.error;
            }
        } catch (error) {
            statusDiv.className = 'status error';
            statusDiv.innerText = '❌ Yhteysvirhe taustapalveluun.';
        }
        
        statusDiv.style.display = 'block';
    });
</script>

</body>
</html>
